<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Activated Personal Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🎙 Voice Activated Personal Assistant</h1>

    <p class="subtitle">
        Speak commands like:
        <br>
        Weather in Kochi • News • Time • Date • Open Google • Open YouTube • Open Gmail • Show Reminders
    </p>

    <button id="voiceButton">
        🎤 Start Listening
    </button>

    <div class="box">
        <h3>Your Command</h3>
        <p id="command">Waiting...</p>
    </div>

    <div class="box">
        <h3>Assistant Response</h3>
        <p id="response">Ready!</p>
    </div>

</div>

<script>

const btn = document.getElementById("voiceButton");
const commandBox = document.getElementById("command");
const responseBox = document.getElementById("response");

// Browser Speech Recognition

const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {

    responseBox.innerHTML =
        "Your browser does not support Speech Recognition.";

    btn.disabled = true;

} else {

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    btn.addEventListener("click", () => {

        btn.disabled = true;
        btn.innerHTML = "🎙 Listening...";

        responseBox.innerHTML = "Listening...";

        recognition.start();

    });

    recognition.onresult = function(event) {

        const command = event.results[0][0].transcript;

        commandBox.innerHTML = command;

        responseBox.innerHTML = "Processing...";

        fetch("/command", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                command: command
            })

        })

        .then(response => response.json())

        .then(data => {
            if (typeof data.response === "object" &&
            data.response.action === "open_url") {
                responseBox.innerHTML = data.response.message;
                speechSynthesis.speak(
                    new SpeechSynthesisUtterance(data.response.message)
                );
                window.open(data.response.url, "_blank");
                return;
            }
            
            responseBox.innerHTML = data.response;
            speechSynthesis.speak(
                new SpeechSynthesisUtterance(data.response)
            );
        })

        .catch(error => {

            console.error(error);

            responseBox.innerHTML =
                "Unable to communicate with the server.";

        })

        .finally(() => {

            btn.disabled = false;

            btn.innerHTML = "🎤 Start Listening";

        });

    };

    recognition.onerror = function(event) {

        responseBox.innerHTML =
            "Speech Recognition Error: " + event.error;

        btn.disabled = false;

        btn.innerHTML = "🎤 Start Listening";

    };

    recognition.onend = function() {

        btn.disabled = false;

        btn.innerHTML = "🎤 Start Listening";

    };

}

</script>

</body>
</html>
